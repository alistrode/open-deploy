set timeout=10
set default=0
insmod part_gpt
insmod part_msdos
insmod ntfs
insmod iso9660
insmod loopback
function od_stop {
    echo 'OpenDeploy boot failed; holding screen. Installation not started.'
    while [ 1 = 1 ]; do sleep 3600; done
}
menuentry 'PXVIRT AUTOMATIC INSTALLATION - logged install v2 - direct PID1' {
    search --no-floppy --file --set=odusb /OpenDeploy-USB.marker
    if search --no-floppy --fs-uuid --set=isopart 888A209C8A208930; then
        if loopback od ($isopart)/OpenDeploy-PXVIRT.iso; then
            if linux (od)/boot/linux26 ro ramdisk_size=16777216 rw panic=0 loglevel=7 log_buf_len=4M proxmox-start-auto-installer; then
                echo 'Loading full split ISO and installation log recorder. Keep E and F connected.'
                if initrd (od)/boot/initrd.img ($isopart)/OpenDeploy-PXVIRT.boot.cpio ($odusb)/boot/opendeploy-install-logging.cpio.gz; then
                    boot
                fi
            fi
        fi
    fi
    od_stop
}
